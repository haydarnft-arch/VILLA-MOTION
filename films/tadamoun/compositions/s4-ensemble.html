<template id="s4-template">
  <div id="root" data-composition-id="s4" data-width="1080" data-height="1920" data-duration="3.85">
    <div id="s4-sport" class="s4-word">SPORT</div>
    <div id="s4-randos" class="s4-word">RANDOS</div>
    <div id="s4-moments" class="s4-small">des moments</div>
    <div id="s4-ensemble" class="s4-word">
      <span class="e">E</span><span class="e">N</span><span class="e">S</span><span class="e">E</span><span class="e">M</span><span class="e">B</span><span class="e">L</span><span class="e">E</span>
    </div>
    <style>
      @font-face { font-family: "Montserrat"; src: url("assets/fonts/montserrat-latin-900-normal.woff2") format("woff2"); font-weight: 900; }
      @font-face { font-family: "Montserrat"; src: url("assets/fonts/montserrat-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      #root { position: absolute; inset: 0; overflow: hidden; }
      .s4-word { position: absolute; left: 0; top: 960px; width: 1080px; text-align: center; white-space: nowrap; font-family: "Montserrat", sans-serif; font-weight: 900; font-size: 168px; line-height: 1; color: #0d1220; }
      #s4-ensemble { font-size: 150px; top: 1010px; }
      #s4-ensemble .e { display: inline-block; }
      .s4-small { position: absolute; left: 0; top: 900px; width: 1080px; text-align: center; font-family: "Montserrat", sans-serif; font-weight: 700; font-size: 60px; color: #0d1220; }
    </style>
    <script src="../vendor/gsap.min.js"></script>
    <script>
      (function () {
        const S = '[data-composition-id="s4"] ';
        const tl = gsap.timeline({ paused: true });
        tl.set([S + "#s4-sport", S + "#s4-randos", S + "#s4-moments", S + "#s4-ensemble"], { opacity: 0 }, 0);
        // SPORT tombe d'en haut (voix 10,12 s = 0,17 s local)
        tl.fromTo(S + "#s4-sport", { opacity: 1, y: -320 }, { opacity: 1, y: 0, duration: 0.32, ease: "expo.out", immediateRender: false }, 0.15);
        // Machine à sous : SPORT part vers le haut, RANDOS arrive d'en bas (voix 10,98 s)
        tl.to(S + "#s4-sport", { y: -220, opacity: 0, duration: 0.15, ease: "power3.in" }, 0.98);
        tl.fromTo(S + "#s4-randos", { opacity: 1, y: 240 }, { opacity: 1, y: 0, duration: 0.22, ease: "expo.out", immediateRender: false }, 1.03);
        // « des moments » puis ENSEMBLE : les lettres convergent depuis le centre (voix 12,06 s)
        tl.to(S + "#s4-randos", { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power3.in" }, 1.98);
        tl.fromTo(S + "#s4-moments", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out" }, 2.08);
        tl.set(S + "#s4-ensemble", { opacity: 1 }, 2.3);
        tl.fromTo(
          S + "#s4-ensemble .e",
          { opacity: 0, x: (i) => (i - 3.5) * 70, scale: 0.6, filter: "blur(10px)" },
          { opacity: 1, x: 0, scale: 1, filter: "blur(0px)", duration: 0.38, ease: "expo.out", stagger: { each: 0.025, from: "center" } },
          2.3
        );
        // Sortie avant le passage au blanc
        tl.to([S + "#s4-moments", S + "#s4-ensemble"], { opacity: 0, filter: "blur(10px)", duration: 0.18, ease: "power3.in", stagger: 0.03 }, 3.45);
        window.__timelines = window.__timelines || {};
        window.__timelines["s4"] = tl;
      })();
    </script>
  </div>
</template>
