<template id="fil-template">
  <div id="root" data-composition-id="fil" data-width="1080" data-height="1920" data-duration="19.6">
    <div id="chev-wrap">
      <svg id="chev" viewBox="0 0 52 32" width="260" height="160" aria-hidden="true">
        <defs>
          <linearGradient id="chev-grad" x1="0" y1="0" x2="1" y2="0">
            <stop id="stop-l1" offset="0" stop-color="#EDAF44" />
            <stop id="stop-l2" offset="0.5" stop-color="#EDAF44" />
            <stop id="stop-r1" offset="0.5" stop-color="#DA5342" />
            <stop id="stop-r2" offset="1" stop-color="#DA5342" />
          </linearGradient>
        </defs>
        <path d="M0 32 L26 0 L52 32 Z M12 32 L26 15 L40 32 Z" fill="url(#chev-grad)" fill-rule="evenodd" />
      </svg>
    </div>
    <style>
      #root { position: absolute; inset: 0; pointer-events: none; }
      #chev-wrap { position: absolute; left: 410px; top: 880px; width: 260px; height: 160px; transform-origin: 50% 50%; }
      #chev { display: block; overflow: visible; filter: drop-shadow(0 0 22px rgba(237, 175, 68, 0.35)); }
    </style>
    <script src="../vendor/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const w = "#chev-wrap";
        // Position de départ : au-dessus du mot TADAMOUN, la montagne se lève (déjà visible à l'image 0)
        tl.set(w, { x: 0, y: -260, scale: 1 }, 0);
        tl.fromTo("#chev", { scaleY: 0.35, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.45, ease: "expo.out" }, 0);
        // SOLIDARITÉ : le chevron monte pour laisser la place au mot
        tl.to(w, { y: -330, duration: 0.35, ease: "power3.out" }, 3.3);
        // Maraudes : il devient le toit au-dessus du bol
        tl.to(w, { y: -480, scale: 1.6, duration: 0.55, ease: "power2.inOut" }, 4.5);
        // Voyages : il glisse à gauche et devient la montagne de départ sur l'horizon
        tl.to(w, { x: -300, y: -64, scale: 1.3, duration: 0.5, ease: "power3.inOut" }, 7.55);
        // Sport : grand sommet au-dessus des mots, sa moitié ambre passe au bleu nuit sur le fond ambre
        tl.to(w, { x: 0, y: -400, scale: 2.2, duration: 0.5, ease: "power2.inOut" }, 9.9);
        tl.to(["#stop-l1", "#stop-l2"], { attr: { "stop-color": "#0D1220" }, duration: 0.4, ease: "power2.inOut" }, 9.95);
        // Logo : il se pose exactement sur le chevron du logo, puis s'efface dans le vrai logo
        tl.to(["#stop-l1", "#stop-l2"], { attr: { "stop-color": "#EDAF44" }, duration: 0.35, ease: "power2.inOut" }, 13.55);
        tl.to(w, { x: 0, y: -356, scale: 0.52, duration: 0.45, ease: "power3.inOut" }, 13.55);
        tl.to("#chev", { opacity: 0, duration: 0.2, ease: "power1.out" }, 14.05);
        window.__timelines = window.__timelines || {};
        window.__timelines["fil"] = tl;
      })();
    </script>
  </div>
</template>
