<template id="s1-template">
  <div id="root" data-composition-id="s1" data-width="1080" data-height="1920" data-duration="4.8">

      <span class="ch">T</span><span class="ch">A</span><span class="ch">D</span><span class="ch">A</span><span class="ch">M</span><span class="ch">O</span><span class="ch">U</span><span class="ch">N</span>

      <span class="sl">S</span><span class="sl">O</span><span class="sl">L</span><span class="sl">I</span><span class="sl">D</span><span class="sl">A</span><span class="sl">R</span><span class="sl">I</span><span class="sl">T</span><span class="sl">É</span>

    <style>
      @font-face { font-family: "Montserrat"; src: url("assets/fonts/montserrat-latin-900-normal.woff2") format("woff2"); font-weight: 900; }
      @font-face { font-family: "Montserrat"; src: url("assets/fonts/montserrat-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "Cairo"; src: url("assets/fonts/cairo-arabic-800-normal.woff2") format("woff2"); font-weight: 800; }
      #root { position: absolute; inset: 0; }
      .s1-line { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; }
      #s1-word { top: 800px; font-family: "Montserrat", sans-serif; font-weight: 900; font-size: 126px; line-height: 1; letter-spacing: 0.01em; color: #f7f4ee; }
      #s1-word .ch, #s1-soli .sl { display: inline-block; }
      #s1-ar { top: 945px; font-family: "Cairo", sans-serif; font-weight: 800; font-size: 176px; line-height: 1.1; color: #da5342; text-shadow: 0 0 40px rgba(218, 83, 66, 0.35); }
      #s1-cap { top: 1165px; font-family: "Montserrat", sans-serif; font-weight: 500; font-size: 40px; letter-spacing: 0.4em; padding-left: 0.4em; color: #9aa4b8; }
      #s1-soli { top: 820px; font-family: "Montserrat", sans-serif; font-weight: 900; font-size: 104px; line-height: 1; color: #edaf44; text-shadow: 0 0 46px rgba(237, 175, 68, 0.4); }

    <script src="../vendor/gsap.min.js"></script>
    <script>
      (function () {
        const S = '[data-composition-id="s1"] ';
        const tl = gsap.timeline({ paused: true });
        // TADAMOUN : lettre par lettre, la première est déjà là à l'image 0
        tl.fromTo(S + "#s1-word .ch", { opacity: 0.55, filter: "blur(3px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power2.out", stagger: 0.06 }, 0);
        // تضامن + « en arabe »
        tl.fromTo(S + "#s1-ar", { opacity: 0, y: 26, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, 1.55);
        tl.fromTo(S + "#s1-cap", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 1.75);
        // Sortie en flou, mot par mot
        tl.to([S + "#s1-word", S + "#s1-ar", S + "#s1-cap"], { opacity: 0, y: -30, filter: "blur(8px)", duration: 0.2, ease: "power3.in", stagger: 0.04 }, 3.1);
        // SOLIDARITÉ claque lettre par lettre sur l'accent sonore (3,39 s)
        tl.fromTo(S + "#s1-soli .sl", { opacity: 0, scale: 1.45, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out", stagger: 0.03 }, 3.33);
        tl.to(S + "#s1-soli", { opacity: 0, filter: "blur(10px)", duration: 0.18, ease: "power3.in" }, 4.5);
        window.__timelines = window.__timelines || {};
        window.__timelines["s1"] = tl;
      })();
