<template id="s3-template">
  <div id="root" data-composition-id="s3" data-width="1080" data-height="1920" data-duration="2.55">
    <div id="s3-stage">
      <svg id="s3-map" viewBox="0 0 1080 1920" width="1080" height="1920" aria-hidden="true">
        <path id="horizon" d="M90 1000 L990 1000" />
        <path id="route" d="M300 830 Q600 540 860 880" />
        <g id="pin">
          <path d="M860 1000 C830 955 812 930 812 905 A48 48 0 1 1 908 905 C908 930 890 955 860 1000 Z" fill="#DA5342" />
          <circle cx="860" cy="905" r="17" fill="#0D1220" />
        </g>
        <circle id="traveller" cx="0" cy="0" r="14" fill="#EDAF44" />
      </svg>
      <div id="s3-title" class="s3-line"><span class="w">DES</span> <span class="w">VOYAGES</span></div>
      <div id="s3-sub" class="s3-line">humanitaires</div>
    </div>
    <style>
      @font-face { font-family: "Montserrat"; src: url("assets/fonts/montserrat-latin-900-normal.woff2") format("woff2"); font-weight: 900; }
      @font-face { font-family: "Montserrat"; src: url("assets/fonts/montserrat-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      #root { position: absolute; inset: 0; }
      #s3-stage { position: absolute; inset: 0; }
      #s3-map { position: absolute; left: 0; top: 0; overflow: visible; }
      #horizon { stroke: #f7f4ee; stroke-width: 6; stroke-linecap: round; opacity: 0.55; fill: none; }
      #route { stroke: #edaf44; stroke-width: 7; stroke-linecap: round; fill: none; }
      #traveller { filter: drop-shadow(0 0 14px rgba(237, 175, 68, 0.9)); }
      .s3-line { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; font-family: "Montserrat", sans-serif; }
      .s3-line span { display: inline-block; }
      #s3-title { top: 1050px; font-weight: 900; font-size: 96px; line-height: 1; color: #f7f4ee; }
      #s3-sub { top: 1165px; font-weight: 700; font-size: 54px; letter-spacing: 0.02em; color: #edaf44; }
    </style>
    <script src="../vendor/gsap.min.js"></script>
    <script src="../vendor/MotionPathPlugin.min.js"></script>
    <script>
      (function () {
        gsap.registerPlugin(MotionPathPlugin);
        const S = '[data-composition-id="s3"] ';
        const tl = gsap.timeline({ paused: true });
        const L = (id) => document.querySelector(S + id).getTotalLength();
        tl.set(S + "#horizon", { strokeDasharray: L("#horizon"), strokeDashoffset: L("#horizon") }, 0);
        tl.set(S + "#route", { strokeDasharray: L("#route"), strokeDashoffset: L("#route") }, 0);
        tl.set(S + "#traveller", { opacity: 0 }, 0);
        tl.set(S + "#pin", { opacity: 0, y: -60, transformOrigin: "860px 1000px" }, 0);
        // Arrivée en panoramique filé depuis la droite
        tl.fromTo(S + "#s3-stage", { x: 1080 }, { x: 0, duration: 0.3, ease: "expo.out" }, 0.02);
        // L'horizon se trace sous la montagne (le chevron)
        tl.to(S + "#horizon", { strokeDashoffset: 0, duration: 0.45, ease: "power3.out" }, 0.22);
        // Le trajet part du sommet, un point lumineux le parcourt jusqu'à l'épingle
        tl.to(S + "#route", { strokeDashoffset: 0, duration: 0.95, ease: "power2.inOut" }, 0.45);
        tl.set(S + "#traveller", { opacity: 1 }, 0.45);
        tl.to(S + "#traveller", { duration: 0.95, ease: "power2.inOut", motionPath: { path: S + "#route", align: S + "#route", alignOrigin: [0.5, 0.5] } }, 0.45);
        tl.to(S + "#pin", { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.4)" }, 1.3);
        tl.to(S + "#traveller", { opacity: 0, duration: 0.15 }, 1.42);
        // Titre mot par mot, puis « humanitaires » en une ligne qui se précise
        tl.fromTo(S + "#s3-title .w", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power2.out", stagger: 0.1 }, 0.24);
        tl.fromTo(S + "#s3-sub", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power2.out" }, 1.1);
        // Sortie avant que le fond ne passe à l'ambre
        tl.to(S + "#s3-stage", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power3.in" }, 2.27);
        window.__timelines = window.__timelines || {};
        window.__timelines["s3"] = tl;
      })();
    </script>
  </div>
</template>
